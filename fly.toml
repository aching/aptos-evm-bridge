# fly.toml — Demo A (OKRW bridge UI). Same image as the swap app; runs only `app`.
app = 'aptos-evm-bridge'
primary_region = 'nrt'

[build]

[processes]
  app = "./scripts/fly-start.sh"

[http_service]
  internal_port = 3024
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
